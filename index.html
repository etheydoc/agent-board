<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>Agent Board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f1115'/%3E%3Ccircle cx='9' cy='16' r='4' fill='%233b82f6'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23a855f7'/%3E%3Ccircle cx='23' cy='16' r='4' fill='%234ade80'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--ink:#14161a;--muted:#646b76;--line:#e3e6eb;--soft:#eef0f3;
  --pc1:#2563eb;--pc2:#9333ea;--mac:#16a34a;--other:#64748b;
  --run:#16a34a;--merge:#0891b2;--limit:#d97706;--wait:#ca8a04;--pause:#64748b;--stop:#9ca3af;--bad:#dc2626;--ok:#16a34a;
  --badbg:#fef2f2;--warnbg:#fffbeb;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a20;--ink:#e8eaee;--muted:#8b93a1;--line:#262a33;--soft:#1f232b;
  --pc1:#60a5fa;--pc2:#c084fc;--mac:#86efac;--other:#94a3b8;
  --run:#4ade80;--merge:#22d3ee;--limit:#fbbf24;--wait:#facc15;--pause:#94a3b8;--stop:#6b7280;--bad:#f87171;--ok:#4ade80;
  --badbg:#2a1517;--warnbg:#2a2312;
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171a20;--ink:#e8eaee;--muted:#8b93a1;--line:#262a33;--soft:#1f232b;
  --pc1:#60a5fa;--pc2:#c084fc;--mac:#86efac;--other:#94a3b8;
  --run:#4ade80;--merge:#22d3ee;--limit:#fbbf24;--wait:#facc15;--pause:#94a3b8;--stop:#6b7280;--bad:#f87171;--ok:#4ade80;
  --badbg:#2a1517;--warnbg:#2a2312;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:1180px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 48px}
header{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
h1{font-size:20px;margin:0;flex:1;letter-spacing:-.01em}
.stamp{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit}
nav{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600}
nav a .n{display:inline-block;min-width:20px;text-align:center;border-radius:999px;background:var(--soft);margin-left:4px;padding:0 5px;font-size:12px}
nav a .n.hot{background:var(--bad);color:#fff}
h2{font-size:16px;margin:26px 2px 10px;display:flex;align-items:baseline;gap:8px;scroll-margin-top:64px}
h2 small{color:var(--muted);font-weight:400;font-size:13px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.mcard{border-top:4px solid var(--c)}
.mhead{display:flex;align-items:center;gap:8px}
.mhead b{font-size:16px;flex:1}
.mline{font-size:13.5px;padding:5px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.mline:first-of-type{border-top:0}
.mline .who{font-weight:700;flex:none;width:30px}
.mline .what{flex:1;min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;margin:6px 0 8px}
.stats b{color:var(--ink)}
.need{border-left:5px solid var(--k)}
.nhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kind{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--k)}
.need .btn{min-height:36px;padding:0 10px;font-size:13px}
.why{background:var(--badbg)}
.mtag{background:var(--c);color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:2px 7px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mtag{color:#0f1115}}
:root[data-theme="dark"] .mtag{color:#0f1115}
.ntitle{font-weight:650;margin:6px 0 4px}
pre{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px;padding:7px 8px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.btn{border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:0 14px;min-height:44px;cursor:pointer;font-weight:600}
.hint{color:var(--muted);font-size:12.5px}
.lane{border-left:5px solid var(--c)}
.lane.dim{opacity:.65}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ltitle{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--s);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--s)}
.pill.live i{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live i{animation:none}}
.job{margin:8px 0 6px}
.jid{font-weight:700}
.jmeta{color:var(--muted);font-size:12.5px}
.brief{margin-top:3px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.last{font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);background:var(--soft);border-radius:6px;padding:5px 7px;margin-top:6px;overflow-wrap:anywhere}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.track{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.track .d{background:var(--c)}.track .p{background:var(--bad)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ "}details[open]>summary::before{content:"▾ "}
ol{list-style:none;margin:4px 0 0;padding:0}
ol li{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px;min-width:0}
ol li>span:last-child{min-width:0;overflow-wrap:anywhere}
ol li .k{flex:none;width:18px;text-align:center}
ol li .t{flex:none;color:var(--muted);font-variant-numeric:tabular-nums;width:62px;white-space:nowrap}
ol li.cur{font-weight:600}
.sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px;font-weight:700}
.art{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.art figure{margin:0;padding:8px}
.art img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--soft);cursor:zoom-in}
.art figure.wide{grid-column:1/-1}
.art figure.wide img{aspect-ratio:auto;object-fit:contain;max-height:80vh;cursor:zoom-out}
.art figcaption{margin-top:6px;font-size:13px}
.art .mtag{background:var(--c)}
.round .rh{display:flex;align-items:center;gap:8px}
.round .rh b{flex:1}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.rl{font-size:13px;padding:3px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.feed li{border-top:0;border-bottom:1px solid var(--line)}
.feed li:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;margin-top:6px}
.summary{display:flex;text-decoration:none;color:var(--ink);align-items:center;gap:10px;font-weight:600;border-left:5px solid var(--k,var(--ok))}
.summary .big{font-size:22px}
.summary:empty{display:none}
.empty,.note{color:var(--muted);text-align:center;padding:22px 10px}
.err{color:var(--bad);font-size:13px;margin:0 2px 10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;min-height:36px;cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--c,var(--ink));color:var(--bg);border-color:transparent}
</style>
</head>
<body>
<main>
  <header>
    <h1>Agent Board</h1>
    <span class="stamp" id="stamp"></span>
    <button class="btn" id="refresh" aria-label="Refresh">↻</button>
  </header>
  <nav id="nav"></nav>
  <div class="err" id="err" hidden></div>
  <a class="card summary" id="summary" href="#" data-go="needs-h"></a>

  <h2 id="art-h">Art <small>the newest previews from the lanes</small></h2>
  <div class="art" id="art"></div>

  <h2 id="machines-h">Machines</h2>
  <div class="grid" id="machines"></div>

  <h2 id="lanes-h">Lanes</h2>
  <div class="filters" id="filters"></div>
  <div class="grid" id="lanes"></div>
  <div id="quiet"></div>

  <h2 id="rounds-h">Rounds <small>the merge lane's merges onto the main line</small></h2>
  <div class="grid" id="rounds"></div>

  <h2 id="activity-h">Activity</h2>
  <div class="card"><ol class="feed" id="feed"></ol></div>

  <h2 id="needs-h">For Cody <small id="needsSub"></small></h2>
  <div id="needs"></div>
</main>


<script>
const MACHINES = [["pc1", "PC 1"], ["pc2", "PC 2"], ["mac", "Mac"]];
const STATE = {
  running: ["Working", "--run", true], merging: ["Merging", "--merge", true], planning: ["Planning", "--merge", true],
  limit: ["Usage limit", "--limit", false], waiting: ["Waiting", "--wait", false], paused: ["Paused", "--pause", false],
  stopped: ["Stopped", "--stop", false], between: ["Next job", "--run", true],
};
// The board is for staying in the loop: it only shows. Cody decides from his Control Centre; whoever is watching
// here just lets him know when something is waiting on him.
const KINDS = {  // what each kind of item is
  parked: ["Parked", "--bad"], open: ["Note for Cody", "--merge"], round: ["Round failed", "--bad"],
  check: ["Main line fails the check", "--limit"], error: ["Runner error", "--limit"], stuck: ["Lane stopped", "--limit"],
  offline: ["Machine offline", "--stop"],
};
const OWNER = "etheydoc";  // the gist's owner, for the raw files when the API is rate-limited
const ART_GIST = "e581fbd5456c0f53221ecdfa70da843d";  // the art strip's thumbnails, one file per machine
const STALE = 10 * 60;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const color = (m) => MACHINES.some(([k]) => k === m) ? `var(--${m})` : "var(--other)";
const label = (m) => (MACHINES.find(([k]) => k === m) || [m, m])[1];
const now = () => Date.now() / 1000;
function ago(t) {
  if (!t) return "";
  const s = Math.max(0, now() - t);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor(s % 3600 / 60) + "m";
  return Math.floor(s / 86400) + "d";
}
const clock = (t) => new Date(t * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
const store = {
  get: (k, d = "") => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

let gist = location.hash.slice(1);
if (gist) store.set("board.gist", gist); else gist = store.get("board.gist");
let filter = store.get("board.filter");
let data = {}, owner = OWNER, fetchedAt = 0;
const art = {};  // machine -> {v, items}: its art strip, fetched only when its snapshot names a new version

async function loadArt() {
  const want = Object.entries(data).filter(([m, d]) => d.art && art[m]?.v !== d.art);
  for (const [m, d] of want) {
    try {
      const a = await (await fetch(`https://gist.githubusercontent.com/${OWNER}/${ART_GIST}/raw/${m}.json?v=${d.art}`)).json();
      if (a.v === d.art) art[m] = a;  // an older copy from the cache is retried next refresh
    } catch {}
  }
  if (want.length) renderArt();
}

function renderArt() {
  const items = Object.entries(art).flatMap(([m, a]) => a.items.map((i) => ({...i, m}))).sort((a, b) => b.at - a.at);
  $("art").innerHTML = items.slice(0, 12).map((i) => `<figure class="card" style="--c:${color(i.m)}">
    <img src="${i.img}" alt="${esc(i.name)}" loading="lazy">
    <figcaption><span class="mtag">${esc(i.lane)}</span> <span class="hint">${ago(i.at)} ago</span><div class="brief clamp">${esc(i.what)}</div></figcaption>
  </figure>`).join("") || '<p class="card empty">No previews from the last two days yet.</p>';
}

async function load() {
  if (!gist) return render();
  try {
    let files;
    const r = await fetch("https://api.github.com/gists/" + gist, {cache: "no-cache"});
    if (r.ok) {
      const g = await r.json();
      owner = g.owner?.login || owner;
      files = {};
      for (const [n, f] of Object.entries(g.files)) {
        files[n] = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
      }
    } else if (owner && (r.status === 403 || r.status === 429)) {  // rate-limited: the raw files still answer
      files = {};
      for (const [m] of MACHINES) {
        const f = await fetch(`https://gist.githubusercontent.com/${owner}/${gist}/raw/${m}.json?t=${Date.now()}`);
        if (f.ok) files[m + ".json"] = await f.text();
      }
    } else throw new Error("GitHub answered " + r.status);
    const next = {};
    for (const [name, text] of Object.entries(files)) {
      if (!name.endsWith(".json")) continue;
      try {
        const d = JSON.parse(text);
        if (d && d.lanes) next[d.machine || name.slice(0, -5)] = d;
      } catch {}
    }
    data = next; fetchedAt = now();
    $("err").hidden = true;
    loadArt();
  } catch (e) {
    $("err").textContent = "Couldn't refresh (" + e.message + "). Showing the last view.";
    $("err").hidden = false;
  }
  render();
}

function laneState(l) {
  if (l.state === "running" && l.job?.finished) return "between";
  return STATE[l.state] ? l.state : "running";
}

function allLanes() {
  const out = [];
  for (const [m, d] of Object.entries(data)) {
    const stale = now() - d.at > STALE;
    for (const l of d.lanes) out.push({...l, m, stale});
  }
  return out;
}

// Everything waiting on Cody, from every machine, with the why. An item drops off once the lane moves on.
function needs() {
  const items = [];
  const add = (o) => items.push(o);
  for (const [m, d] of Object.entries(data)) {
    const stale = now() - d.at > STALE;
    if (stale && d.lanes.some((l) => l.alive)) {
      add({id: `offline:${m}`, kind: "offline", m, title: `${label(m)} has been silent for ${ago(d.at)}`,
           why: "Its lanes were running at its last report. It may be asleep, off the network, or its feed stopped.", at: d.at});
    }
    for (const l of d.lanes) {
      const brief = (id) => (l.jobs || []).find((j) => j[1] === id)?.[4] || "";
      for (const j of (l.jobs || []).filter((j) => j[0] === "!")) {
        add({id: `parked:${l.lane}:${j[1]}`, kind: "parked", m, lane: l.lane, job: j[1], title: `${j[1]} parked`,
             why: l.why?.[j[1]] || "", brief: j[4], meta: `${j[2]} · ${j[3]}`});
      }
      for (const o of l.open || []) {
        add({id: `open:${l.lane}:${o.job}`, kind: "open", m, lane: l.lane, job: o.job, title: `${o.job}: calls left for you`,
             why: o.text, brief: brief(o.job), meta: o.role});
      }
      for (const [t, text] of l.errors || []) {
        add({id: `error:${l.lane}:${t}`, kind: "error", m, lane: l.lane, title: `${l.lane}'s runner hit an error`, why: text, at: t});
      }
      for (const [t, msg] of l.events || []) {
        if (/starting point already fails the check/.test(msg) && t > now() - 12 * 3600) {
          add({id: `check:${l.lane}:${t}`, kind: "check", m, lane: l.lane, title: "The main line already fails the check", why: msg, at: t});
        }
        const rf = msg.match(/^round (\d+): did not land/);
        if (rf) {
          const r = (d.rounds || []).find((x) => x.n === +rf[1]);
          add({id: `round:${rf[1]}`, kind: "round", m, lane: l.lane, title: `Round ${rf[1]} did not land`,
               why: r ? [...r.lines, r.tail].filter(Boolean).join("\n") : msg, at: t});
        }
      }
      if (!l.alive && /could not merge|runner error|nothing left to plan/.test(l.last || "") && l.events?.length
          && l.events[l.events.length - 1][0] > now() - 12 * 3600) {
        add({id: `stuck:${l.lane}:${l.events[l.events.length - 1][0]}`, kind: "stuck", m, lane: l.lane,
             title: `${l.lane} stopped on its own`, why: l.last, at: l.events[l.events.length - 1][0]});
      }
    }
  }
  const seenRound = new Set();
  const order = ["parked", "round", "stuck", "offline", "check", "error", "open"];
  return items.filter((i) => i.kind !== "round" || (!seenRound.has(i.id) && seenRound.add(i.id)))
    .sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
}

function render() {
  if (!gist) {
    $("needs").innerHTML = '<p class="note">Open the board from its full link (the part after # is the feed). It is remembered after that.</p>';
    return;
  }
  $("stamp").textContent = fetchedAt ? "updated " + clock(fetchedAt) : "loading…";
  const lanes = allLanes();
  const list = needs();
  const open = list.length;
  $("needsSub").textContent = open ? `${open} waiting` : "";
  renderSummary(lanes, list, open);
  $("nav").innerHTML = [["art-h", "Art"], ["machines-h", "Machines"],["lanes-h", "Lanes", lanes.filter((l) => l.alive && !l.stale).length],
    ["rounds-h", "Rounds"], ["activity-h", "Activity"], ["needs-h", "For Cody", open, open > 0]]
    .map(([id, t, n, hot]) => `<a href="#" data-go="${id}">${t}${n !== undefined ? `<span class="n${hot ? " hot" : ""}">${n}</span>` : ""}</a>`).join("");
  renderNeeds(list);
  if (!$("art").innerHTML) renderArt();  // otherwise only when a strip changes: the images stay decoded
  renderMachines(lanes);
  renderRounds();
  renderLanes(lanes);
}

// One line up top: is everything fine, or does someone need to tell Cody?
function renderSummary(lanes, list, open) {
  const live = lanes.filter((l) => l.alive && !l.stale);
  const machines = new Set(live.map((l) => l.m)).size;
  const urgent = list.filter((i) => i.kind !== "open").length;
  const [k, icon, text] = urgent ? ["--bad", "⚠", `${urgent} thing${urgent > 1 ? "s are" : " is"} waiting on Cody. Give him a shout.`]
    : open ? ["--merge", "•", `All running. ${open} note${open > 1 ? "s" : ""} left for Cody, nothing urgent.`]
    : ["--ok", "✓", "All running smoothly."];
  $("summary").style.setProperty("--k", `var(${k})`);
  $("summary").innerHTML = `<span class="big" style="color:var(${k})">${icon}</span><span>${text}
    <span class="hint" style="font-weight:400">${live.length} lane${live.length === 1 ? "" : "s"} working on ${machines} machine${machines === 1 ? "" : "s"}.</span></span>`;
}

function renderNeeds(list) {
  $("needs").innerHTML = list.length ? `<div class="grid">${list.map(needCard).join("")}</div>`
    : '<p class="card empty">Nothing waiting on Cody.</p>';
}

// What "Copy for Cody" puts on the clipboard, ready to paste into a message.
function needText(i) {
  return [`[Agent board] ${label(i.m)}${i.lane ? " · " + i.lane : ""}: ${KINDS[i.kind][0]}`, i.title, i.why ? i.why.slice(0, 900) : ""]
    .filter(Boolean).join("\n");
}

function needCard(i) {
  return `<section class="card need" style="--k:var(${KINDS[i.kind][1]});--c:${color(i.m)}">
    <div class="nhead"><span class="mtag">${esc(label(i.m))}${i.lane ? " · " + esc(i.lane) : ""}</span><span class="kind">${KINDS[i.kind][0]}</span>
      ${i.at ? `<span class="hint">${ago(i.at)} ago</span>` : ""}<span style="flex:1"></span><button class="btn" data-copy="${esc(i.id)}">Copy for Cody</button></div>
    <div class="ntitle">${esc(i.title)}${i.meta ? ` <span class="jmeta">${esc(i.meta)}</span>` : ""}</div>
    ${i.why || i.brief ? `<details><summary>Details</summary>${i.why ? `<pre>${esc(i.why)}</pre>` : ""}${i.brief ? `<div class="brief">${esc(i.brief)}</div>` : ""}</details>` : ""}
  </section>`;
}

function renderMachines(lanes) {
  const keys = [...new Set([...MACHINES.map(([k]) => k), ...Object.keys(data)])];
  $("machines").innerHTML = keys.map((k) => {
    const d = data[k];
    if (!d) return `<section class="card mcard" style="--c:${color(k)}"><div class="mhead"><b>${esc(label(k))}</b><span class="hint">no feed yet</span></div>
      <p class="hint">${k === "mac" ? "Run <code>bash scripts/mac_board_join.sh</code> once in the Mac's checkout." : "Its feed starts with its next lane start once it has the main line."}</p></section>`;
    const stale = now() - d.at > STALE;
    const mine = lanes.filter((l) => l.m === k);
    const live = mine.filter((l) => l.alive);
    const st = (s) => live.filter((l) => laneState(l) === s).length;
    const done = mine.reduce((n, l) => n + l.done, 0), parked = mine.reduce((n, l) => n + l.parked, 0);
    const ahead = mine.reduce((n, l) => n + (l.jobs || []).filter((j) => j[0] === " ").length, 0);
    const lastEv = Math.max(0, ...mine.flatMap((l) => (l.events || []).map((e) => e[0])));
    const status = stale ? `<span class="bad">offline · ${ago(d.at)}</span>` : live.length ? `${live.length} lane${live.length > 1 ? "s" : ""} running` : "idle";
    const lines = live.map((l) => {
      const s = laneState(l), j = l.job;
      const what = s === "running" && j ? `<b>${esc(j.id)}</b> ${esc(j.role || "")}${l.since ? " · " + ago(l.since) : ""} — ${esc((j.brief || "").slice(0, 110))}${(j.brief || "").length > 110 ? "…" : ""}`
        : `${STATE[s][0]}${l.last ? ": " + esc(l.last.slice(0, 110)) : ""}`;
      return `<div class="mline"><span class="who">${esc(l.lane)}</span><span class="what">${what}</span></div>`;
    }).join("");
    return `<section class="card mcard" style="--c:${color(k)}">
      <div class="mhead"><b>${esc(label(k))}</b><span class="hint">${status}</span></div>
      <div class="stats"><span><b>${st("running") + st("between")}</b> working</span>${st("merging") + st("planning") ? `<span><b>${st("merging") + st("planning")}</b> merging/planning</span>` : ""}
        ${st("limit") ? `<span><b>${st("limit")}</b> at a limit</span>` : ""}${st("waiting") + st("paused") ? `<span><b>${st("waiting") + st("paused")}</b> waiting</span>` : ""}
        <span><b>${done}</b> done</span><span><b>${ahead}</b> queued</span>${parked ? `<span class="bad">${parked} parked</span>` : ""}
        ${lastEv ? `<span>last news ${ago(lastEv)} ago</span>` : ""}</div>
      ${lines || '<p class="hint" style="margin:0">No lane running.</p>'}
    </section>`;
  }).join("");
}

function renderRounds() {
  const rs = [];
  for (const [m, d] of Object.entries(data)) for (const r of d.rounds || []) rs.push({...r, m});
  rs.sort((a, b) => b.at - a.at);
  $("rounds").innerHTML = rs.slice(0, 4).map((r) => {
    const get = (p) => r.lines.filter((l) => l.startsWith(p)).map((l) => l.slice(p.length + 1).trim());
    const merged = get("merged")[0] || "";
    const n = merged ? merged.split(",").length : 0;
    const uploads = get("upload waiting");
    return `<section class="card round" style="--c:${color(r.m)}">
      <div class="rh"><b>Round ${r.n}</b><span class="${r.ok ? "ok" : "bad"}">${r.ok ? "landed" : "did not land"}</span><span class="hint">${ago(r.at)} ago</span></div>
      <div class="stats"><span><b>${n}</b> branches merged</span><span><b>${r.folded}</b> notes folded</span></div>
      ${["check.sh", "smoke", "sent back"].flatMap((p) => get(p).map((v) => `<div class="rl"><b>${esc(p)}</b> ${esc(v)}</div>`)).join("")}
      ${uploads.length ? `<div class="rl"><b>uploads waiting</b> ${uploads.length}: ${esc(uploads.join(" · ").slice(0, 300))}</div>` : ""}
      ${merged ? `<details><summary>Merged branches</summary><div class="hint">${esc(merged)}</div></details>` : ""}
      ${r.tail ? `<details${r.ok ? "" : " open"}><summary>Log tail</summary><pre>${esc(r.tail)}</pre></details>` : ""}
    </section>`;
  }).join("") || '<p class="card empty">No rounds in the last three days.</p>';
}

function renderLanes(lanes) {
  const present = [...new Set(lanes.map((l) => l.m))];
  $("filters").innerHTML = [["", "All"], ...MACHINES.filter(([k]) => present.includes(k))]
    .map(([k, t]) => `<button class="chip${filter === k ? " on" : ""}" style="${k ? `--c:${color(k)}` : ""}" data-m="${k}">${t}</button>`).join("");
  const shown = lanes.filter((l) => !filter || l.m === filter);
  const rank = {running: 0, between: 0, merging: 1, planning: 1, limit: 2, waiting: 3, paused: 4, stopped: 5};
  shown.sort((a, b) => (a.stale - b.stale) || ((rank[laneState(a)] ?? 9) - (rank[laneState(b)] ?? 9)) || a.lane.localeCompare(b.lane));
  const active = shown.filter((l) => l.alive && !l.stale), quiet = shown.filter((l) => !(l.alive && !l.stale));
  $("lanes").innerHTML = active.length ? active.map(card).join("") : '<p class="card empty">No lanes running right now.</p>';
  $("quiet").innerHTML = quiet.length ? `<details><summary>Stopped in the last 12 hours (${quiet.length})</summary><div class="grid">${quiet.map(card).join("")}</div></details>` : "";

  const feed = [];
  for (const l of shown) for (const [t, msg] of l.events || []) feed.push([t, l.m, l.lane, msg]);
  feed.sort((a, b) => b[0] - a[0]);
  $("feed").innerHTML = feed.slice(0, 40).map(([t, m, lane, msg]) =>
    `<li><span class="dot" style="--c:${color(m)}"></span><span class="t">${clock(t)}</span><span><b>${esc(lane)}</b> ${esc(msg)}</span></li>`
  ).join("") || '<li class="empty">Nothing yet.</li>';
}

function card(l) {
  const st = l.stale ? "stopped" : laneState(l);
  const [name, svar, live] = STATE[st];
  const stText = l.stale ? "Machine offline" : st === "limit" && /waiting (\d+) min/.test(l.last) ? "Usage limit · " + l.last.match(/waiting (\d+) min/)[1] + "m wait" : name;
  const j = l.job;
  const jobHtml = j && l.alive ? `<div class="job"><span class="jid">${esc(j.id)}</span>
    <span class="jmeta">${esc([j.role, j.effort].filter(Boolean).join(" · "))}${l.since && !j.finished ? " · for " + ago(l.since) : ""}${j.finished ? " · just finished" : ""}</span>
    ${j.brief ? `<div class="brief clamp" title="Tap to expand">${esc(j.brief)}</div>` : ""}</div>` : "";
  const pct = (n) => l.total ? (100 * n / l.total).toFixed(1) + "%" : "0";
  const last = l.last && !(st === "running" && j && l.last.startsWith(j.id + " (")) ? `<div class="last">${esc(l.last)}</div>` : "";
  const jobs = l.jobs || [];
  const row = ([s, id, role, effort, brief]) => {
    const cur = j && id === j.id && l.alive;
    const k = s === "x" ? "✓" : s === "!" ? "⚠" : cur ? "●" : "○";
    return `<li class="${cur ? "cur" : ""}"><span class="k">${k}</span><span><b>${esc(id)}</b> <span class="jmeta">${esc(role)} · ${esc(effort)}</span><br><span class="brief clamp">${esc(brief)}</span>${s === "!" && l.why?.[id] ? `<pre class="why">${esc(l.why[id])}</pre>` : ""}</span></li>`;
  };
  const next = jobs.filter((x) => x[0] === " " && !(j && x[1] === j.id && l.alive));
  const done = jobs.filter((x) => x[0] !== " ").reverse();
  const events = (l.events || []).slice().reverse().map(([t, msg]) => `<li><span class="t">${clock(t)}</span><span>${esc(msg)}</span></li>`).join("");
  return `<section class="card lane${l.alive && !l.stale ? "" : " dim"}" style="--c:${color(l.m)}">
    <div class="top"><span class="mtag">${esc(l.lane)}</span><span class="ltitle">${esc(l.title.replace(/^Lane \w+:\s*/, ""))}</span>
      <span class="pill${live && !l.stale ? " live" : ""}" style="--s:var(${l.stale ? "--stop" : svar})"><i></i>${esc(stText)}</span></div>
    ${jobHtml}${last}
    <div class="bar"><div class="track"><span class="d" style="width:${pct(l.done)}"></span><span class="p" style="width:${pct(l.parked)}"></span></div>
      ${l.done}/${l.total}${l.parked ? ` · <span style="color:var(--bad)">${l.parked} parked</span>` : ""}${l.commit ? " · commit " + ago(l.commit[0]) + " ago" : ""}</div>
    ${next.length ? `<details${l.alive ? " open" : ""}><summary>Up next (${next.length})</summary><ol>${next.slice(0, 4).map(row).join("")}</ol>${next.length > 4 ? `<details><summary>${next.length - 4} more</summary><ol>${next.slice(4).map(row).join("")}</ol></details>` : ""}</details>` : ""}
    ${done.length ? `<details><summary>Done and parked (${done.length})</summary><ol>${done.map(row).join("")}</ol></details>` : ""}
    ${l.commit ? `<div class="hint" style="margin-top:6px">Last commit: ${esc(l.commit[1])}</div>` : ""}
    ${events ? `<details><summary>Messages</summary><ol>${events}</ol></details>` : ""}
  </section>`;
}

document.addEventListener("click", async (e) => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); $(go.dataset.go).scrollIntoView({behavior: "smooth"}); return; }
  const chip = e.target.closest("[data-m]");
  if (chip) { filter = filter === chip.dataset.m ? "" : chip.dataset.m; store.set("board.filter", filter); render(); return; }
  const pic = e.target.closest(".art img");
  if (pic) { pic.closest("figure").classList.toggle("wide"); return; }
  const clamp = e.target.closest(".clamp");
  if (clamp) { clamp.classList.remove("clamp"); return; }
  const copy = e.target.closest("[data-copy]");
  if (!copy) return;
  const item = needs().find((x) => x.id === copy.dataset.copy);
  try { await navigator.clipboard.writeText(needText(item)); copy.textContent = "Copied ✓"; }
  catch { copy.textContent = "Couldn't copy"; }
  setTimeout(() => { copy.textContent = "Copy for Cody"; }, 1800);
});

$("refresh").addEventListener("click", load);
const POLL = 75;  // GitHub allows a page with no token 60 calls an hour; past that the raw files still answer
let timer;
function schedule() { clearInterval(timer); if (!document.hidden) timer = setInterval(load, POLL * 1000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); schedule(); });
setInterval(() => { if (!document.hidden) render(); }, 30000);
load(); schedule();
</script>
</body>
</html>
